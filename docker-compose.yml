# =============================================================================
# PerGo — Production / Dokploy compose
# =============================================================================
# This file runs: pergo app + NATS (PerGo-specific).
# Postgres is EXTERNAL — provided by your shared infra compose.
#
# For local development, Docker Compose auto-loads docker-compose.override.yml
# which adds a local Postgres instance. Just run: docker compose up
#
# For Dokploy, set these env vars in the project's Environment panel:
#   PERGO_DATABASE_URL  → postgres://pergo:xxx@postgres:5432/pergo?sslmode=disable
#   PERGO_ADMIN_PASSWORD
#   PERGO_EXTERNAL_URL
# =============================================================================

services:
  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data
    expose:
      - "4222"
    healthcheck:
      test: ["CMD", "nats-server", "--check", "4222"]
      interval: 5s
      timeout: 5s
      retries: 5

  pergo:
    build: .
    restart: unless-stopped
    ports:
      - "${PERGO_PORT:-8080}:8080"
    depends_on:
      nats:
        condition: service_healthy
    environment:
      PERGO_DATABASE_URL: ${PERGO_DATABASE_URL}
      PERGO_NATS_URL: nats://nats:4222
      PERGO_SERVER_PORT: "8080"
      PERGO_ADMIN_PASSWORD: ${PERGO_ADMIN_PASSWORD:-pergo-dev-2026}
      PERGO_EXTERNAL_URL: ${PERGO_EXTERNAL_URL:-http://localhost:8080}
    networks:
      - default
      - shared-infra

volumes:
  nats-data:

networks:
  shared-infra:
    external: true
