<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0d0e12" />
      <stop offset="100%" stop-color="#12131a" />
    </linearGradient>

    <!-- Radial Ambient Glows -->
    <radialGradient id="emeraldGlow" cx="150" cy="80" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="indigoGlow" cx="950" cy="100" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="600" cy="300" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Logo & Accent Gradients -->
    <linearGradient id="brandLogoGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="accentLineGrad" x1="0" y1="0" x2="480" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="480" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0f0f12" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="cardBorderGrad" x1="0" y1="0" x2="480" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#52525b" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#27272a" fill-opacity="0.45" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Edges and Crisp Border -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="url(#bgGrad)" stroke="#27272a" stroke-width="1" />

  <!-- Grid Lattice Overlay -->
  <rect x="1" y="1" width="1198" height="358" rx="16" fill="url(#gridPattern)" />

  <!-- Ambient Glow Spheres -->
  <rect x="1" y="1" width="1198" height="358" rx="16" fill="url(#emeraldGlow)" />
  <rect x="1" y="1" width="1198" height="358" rx="16" fill="url(#indigoGlow)" />
  <rect x="1" y="1" width="1198" height="358" rx="16" fill="url(#cyanGlow)" />

  <!-- Top Ambient Glow Edge -->
  <path d="M 16 1 L 1184 1" stroke="url(#accentLineGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- LEFT SECTION: Branding, Tagline & Features -->
  <g transform="translate(64, 48)">
    <!-- Logo Badge -->
    <g>
      <rect x="0" y="0" width="58" height="58" rx="14" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" filter="url(#cardShadow)" />
      <!-- Stylized Interconnected Wave / Lightning PerGo Icon -->
      <path d="M 29 11 L 19 31 L 28 31 L 25 47 L 39 25 L 30 25 Z" fill="url(#brandLogoGrad)" />
      <circle cx="17" cy="17" r="3.5" fill="#10b981" />
      <circle cx="41" cy="41" r="3.5" fill="#6366f1" />
      <circle cx="41" cy="17" r="2.5" fill="#06b6d4" />
    </g>

    <!-- Brand Name and Version Badge -->
    <g transform="translate(74, 6)">
      <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.04em" fill="url(#textGrad)">PerGo</text>

      <!-- Badge: Production Ready -->
      <g transform="translate(142, 10)">
        <rect x="0" y="0" width="124" height="26" rx="13" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
        <circle cx="12" cy="13" r="4" fill="#10b981">
          <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
        </circle>
        <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399" letter-spacing="0.04em">CPaaS v1.0 • Go</text>
      </g>
    </g>

    <!-- High-Impact Tagline -->
    <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.02em" fill="#f4f4f5">
      Autonomous Omnichannel Messaging Infrastructure
    </text>

    <!-- Sub-description -->
    <text x="0" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#a1a1aa" letter-spacing="-0.01em">
      High-throughput unified messaging broker for WhatsApp Cloud (WABA),
    </text>
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#a1a1aa" letter-spacing="-0.01em">
      WhatsApp Web, Telegram &amp; Webhooks with zero external runtime dependencies.
    </text>

    <!-- Channel Feature Pills -->
    <g transform="translate(0, 186)">
      <!-- WhatsApp Cloud -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="138" height="28" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#22c55e" />
        <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e4e4e7">WhatsApp Cloud</text>
      </g>

      <!-- WhatsApp Web -->
      <g transform="translate(146, 0)">
        <rect x="0" y="0" width="130" height="28" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#10b981" />
        <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e4e4e7">WhatsApp Web</text>
      </g>

      <!-- Telegram -->
      <g transform="translate(284, 0)">
        <rect x="0" y="0" width="94" height="28" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#0ea5e9" />
        <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e4e4e7">Telegram</text>
      </g>

      <!-- NATS JetStream -->
      <g transform="translate(386, 0)">
        <rect x="0" y="0" width="118" height="28" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#818cf8" />
        <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e4e4e7">NATS PubSub</text>
      </g>

      <!-- OpenAPI 3.1 Scalar -->
      <g transform="translate(0, 36)">
        <rect x="0" y="0" width="138" height="28" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#a855f7" />
        <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e4e4e7">Scalar OpenAPI 3.1</text>
      </g>

      <!-- MCP Native -->
      <g transform="translate(146, 36)">
        <rect x="0" y="0" width="110" height="28" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#f59e0b" />
        <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e4e4e7">MCP Protocol</text>
      </g>

      <!-- Strict Multi-Tenant -->
      <g transform="translate(264, 36)">
        <rect x="0" y="0" width="136" height="28" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#06b6d4" />
        <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#e4e4e7">PostgreSQL + RLS</text>
      </g>
    </g>
  </g>

  <!-- RIGHT SECTION: Sleek Glassmorphic Terminal Card -->
  <g transform="translate(630, 44)">
    <!-- Terminal Background Card -->
    <rect x="0" y="0" width="506" height="272" rx="12" fill="url(#cardGrad)" stroke="url(#cardBorderGrad)" stroke-width="1.5" filter="url(#cardShadow)" />

    <!-- Terminal Title Bar -->
    <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 494 0 C 500.63 0 506 5.37 506 12 L 506 38 L 0 38 Z" fill="#141417" />
    <line x1="0" y1="38.5" x2="506" y2="38.5" stroke="#27272a" stroke-width="1" />

    <!-- Terminal Window Controls -->
    <circle cx="18" cy="19" r="5" fill="#ef4444" fill-opacity="0.8" />
    <circle cx="34" cy="19" r="5" fill="#eab308" fill-opacity="0.8" />
    <circle cx="50" cy="19" r="5" fill="#22c55e" fill-opacity="0.8" />

    <!-- Terminal Header Title -->
    <text x="80" y="23" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace" font-size="11.5" font-weight="500" fill="#71717a">pergo-router — omnichannel-dispatch</text>

    <!-- Telemetry Status in Title -->
    <g transform="translate(420, 11)">
      <rect x="0" y="0" width="70" height="16" rx="8" fill="#10b981" fill-opacity="0.15" />
      <text x="35" y="12" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#34d399" text-anchor="middle">LIVE 1.0</text>
    </g>

    <!-- Code / Dispatch Visualizer Content -->
    <g transform="translate(20, 56)">
      <!-- Line 1: Ingest -->
      <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#38bdf8">POST</text>
      <text x="40" y="16" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#f4f4f5">/api/v1/messages</text>
      <text x="375" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#10b981">202 ACCEPTED</text>

      <!-- Line 2: Dispatch Tree Node 1 (WABA) -->
      <text x="0" y="44" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="400" fill="#52525b">├──</text>
      <text x="28" y="44" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#a1a1aa">channel:</text>
      <text x="96" y="44" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#22c55e">whatsapp_cloud</text>
      <text x="210" y="44" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="400" fill="#71717a">(Meta Graph v21.0)</text>
      <text x="415" y="44" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10b981">4ms</text>

      <!-- Line 3: Dispatch Tree Node 2 (WhatsApp Web) -->
      <text x="0" y="72" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="400" fill="#52525b">├──</text>
      <text x="28" y="72" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#a1a1aa">channel:</text>
      <text x="96" y="72" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#10b981">whatsapp_web</text>
      <text x="210" y="72" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="400" fill="#71717a">(whatsmeow-go)</text>
      <text x="415" y="72" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10b981">7ms</text>

      <!-- Line 4: Dispatch Tree Node 3 (Telegram) -->
      <text x="0" y="100" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="400" fill="#52525b">├──</text>
      <text x="28" y="100" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#a1a1aa">channel:</text>
      <text x="96" y="100" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#0ea5e9">telegram_bot</text>
      <text x="210" y="100" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="400" fill="#71717a">(@PerGoDemoBot)</text>
      <text x="415" y="100" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10b981">5ms</text>

      <!-- Line 5: Dispatch Tree Node 4 (PubSub) -->
      <text x="0" y="128" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="400" fill="#52525b">└──</text>
      <text x="28" y="128" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#a1a1aa">pubsub:</text>
      <text x="96" y="128" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#818cf8">nats.jetstream</text>
      <text x="210" y="128" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="400" fill="#71717a">(events.outbound)</text>
      <text x="415" y="128" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10b981">1ms</text>

      <!-- Separator line -->
      <line x1="0" y1="148" x2="466" y2="148" stroke="#27272a" stroke-width="1" />

      <!-- Bottom telemetry stats inside terminal -->
      <g transform="translate(0, 168)">
        <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#71717a">E2E Latency: <tspan fill="#f4f4f5" font-weight="700">&lt; 8ms</tspan></text>
        <text x="160" y="14" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#71717a">PII Guard: <tspan fill="#34d399" font-weight="700">100% Safe</tspan></text>
        <text x="320" y="14" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#71717a">Tenant: <tspan fill="#a78bfa" font-weight="700">Isolated</tspan></text>
      </g>
    </g>
  </g>
</svg>
