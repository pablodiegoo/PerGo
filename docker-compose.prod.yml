# =============================================================================
# PerGo — Production Docker Compose with Traefik & Automated TLS (Let's Encrypt)
# =============================================================================
# Architecture:
#   - Traefik v3: Edge reverse proxy with automated ACME/Let's Encrypt TLS certificates,
#     automatic HTTP->HTTPS redirection, and dynamic Docker service discovery.
#   - PerGo: High-performance Go CPaaS Data Plane daemon (unified WhatsApp, WABA, Telegram).
#   - PostgreSQL 16: Primary relational database with embedded goose migrations.
#   - NATS JetStream: Distributed, durable message broker for async delivery & backpressure.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
# =============================================================================

services:
  traefik:
    image: traefik:v3.1
    container_name: pergo-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=false"
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-certificates:/letsencrypt"
    networks:
      - pergo-network

  postgres:
    image: postgres:16-alpine
    container_name: pergo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pergo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be defined}
      POSTGRES_DB: ${POSTGRES_DB:-pergo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pergo} -d $${POSTGRES_DB:-pergo}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - pergo-network

  nats:
    image: nats:2.10-alpine
    container_name: pergo-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "nats-server", "--check", "4222"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - pergo-network

  pergo:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/pablodiegoo/pergo:latest
    container_name: pergo-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      PERGO_ENV: production
      PERGO_DATABASE_URL: postgres://${POSTGRES_USER:-pergo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pergo}?sslmode=disable
      PERGO_NATS_URL: nats://nats:4222
      PERGO_SERVER_PORT: "8080"
      PERGO_EXTERNAL_URL: https://${DOMAIN:?DOMAIN must be defined}
      PERGO_ADMIN_PASSWORD: ${PERGO_ADMIN_PASSWORD:?PERGO_ADMIN_PASSWORD must be defined}
      PERGO_SESSION_SECRET: ${PERGO_SESSION_SECRET:?PERGO_SESSION_SECRET must be defined}
      PERGO_KEK_BASE64: ${PERGO_KEK_BASE64:?PERGO_KEK_BASE64 must be defined (32 bytes base64)}
      PERGO_S3_ENDPOINT: ${PERGO_S3_ENDPOINT:-}
      PERGO_S3_BUCKET: ${PERGO_S3_BUCKET:-}
      PERGO_S3_ACCESS_KEY: ${PERGO_S3_ACCESS_KEY:-}
      PERGO_S3_SECRET_KEY: ${PERGO_S3_SECRET_KEY:-}
      PERGO_S3_REGION: ${PERGO_S3_REGION:-us-east-1}
      PERGO_S3_USE_PATH_STYLE: ${PERGO_S3_USE_PATH_STYLE:-false}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pergo.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.pergo.entrypoints=websecure"
      - "traefik.http.routers.pergo.tls=true"
      - "traefik.http.routers.pergo.tls.certresolver=letsencrypt"
      - "traefik.http.services.pergo.loadbalancer.server.port=8080"
    volumes:
      - pergo-media:/app/data/media
    networks:
      - pergo-network

volumes:
  postgres-data:
    name: pergo-postgres-data
  nats-data:
    name: pergo-nats-data
  traefik-certificates:
    name: pergo-traefik-certificates
  pergo-media:
    name: pergo-media-data

networks:
  pergo-network:
    name: pergo-network
    driver: bridge
