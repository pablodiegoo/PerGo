openapi: 3.1.0
info:
  title: PerGo Omnichannel CPaaS API
  version: 2.0.0
  description: |
    PerGo is a high-performance, self-hosted open-source Omnichannel Communications Platform as a Service (CPaaS) engineered in Go.
    It exposes a single unified REST API (`POST /messages`) that abstracts away multiple messaging providers
    (WhatsApp Web via whatsmeow with SOCKS5 proxy isolation, WhatsApp Cloud WABA, Telegram, Instagram, and Email)
    with automatic fallback, stateless Meta Flow execution, rich interactive components (buttons, lists, catalog products),
    HMAC-SHA256 webhook signatures, and automated LGPD data retention policies.

    ---

    ### ⚡ Quickstart: Time-To-First-Message em < 3 Minutos

    1. **Autenticação**:
       Gere sua API Key no Developer Portal (`/admin/developers`) ou via `POST /api/v1/workspaces`.
       Envie a chave no cabeçalho `Authorization: Bearer <SUA_API_KEY>` ou query string `?api_key=<SUA_API_KEY>`.

    2. **Conectar Canal**:
       - **WhatsApp Web**: Inicie o pareamento com `POST /api/v1/connections/pair` e escaneie o QR Code retornado.
       - **WhatsApp Cloud (WABA)**: Cadastre suas credenciais com `POST /api/v1/connections/waba`.
       - **Telegram**: Cadastre seu bot token com `POST /api/v1/connections/telegram`.

    3. **Enviar Mensagem (`POST /messages`)**:
       ```bash
       curl -X POST http://localhost:8080/messages \
         -H "Authorization: Bearer <SUA_API_KEY>" \
         -H "Content-Type: application/json" \
         -d '{
           "to": "+5511999998888",
           "channel": "whatsapp",
           "body": "Olá! Minha primeira mensagem enviada via PerGo ⚡"
         }'
       ```
    A mensagem é aceita imediatamente (`202 Accepted`) e enfileirada no NATS JetStream para entrega com telemetria e retry automático.
servers:
  - url: /
    description: Current PerGo Instance Server
security:
  - BearerAuth: []

paths:
  /:
    get:
      summary: Landing page and agent entrypoint
      description: "Serves the landing page HTML for human visitors, or negotiated Markdown summary for agents supplying Accept: text/markdown."
      operationId: getLanding
      security: []
      parameters:
        - name: Accept
          in: header
          required: false
          description: Media type preference for content negotiation. Set to `text/markdown` for agent Markdown format.
          schema:
            type: string
            example: text/markdown
      responses:
        '200':
          description: Landing page HTML or negotiated Markdown summary
          headers:
            Link:
              description: RFC 8288 Web Linking header pointing to agent indexes
              schema:
                type: string
                example: '</llms.txt>; rel="describedby", </llms-full.txt>; rel="alternate"; type="text/markdown"'
            Vary:
              description: Informs HTTP caches that representation varies based on Accept and Accept-Encoding headers
              schema:
                type: string
                example: 'Accept, Accept-Encoding'
          content:
            text/html:
              schema:
                type: string
            text/markdown:
              schema:
                type: string

  /messages:
    post:
      summary: Send unified message
      description: Dispatches an omnichannel message across WhatsApp, WhatsApp Cloud, Telegram, Instagram, or Email with optional automatic fallback, interactive menus, media, and templates.
      operationId: sendMessage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '202':
          description: Message accepted and queued for asynchronous dispatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMessageResponse'
        '400':
          description: Invalid payload or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API key
        '422':
          description: Unprocessable entity or session window expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit or queue depth backpressure exceeded

  /health:
    get:
      summary: Health check
      description: Returns overall system health status.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: System is healthy
        '503':
          description: System is unhealthy

  /health/ready:
    get:
      summary: Readiness check
      description: Verifies database and NATS JetStream connectivity.
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: System is ready to accept traffic
        '503':
          description: Underlying services are not ready

  /health/live:
    get:
      summary: Liveness check
      description: Fast liveness check for container orchestrators.
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Process is running

  /healthz:
    get:
      summary: Liveness probe
      description: Fast liveness check for container orchestrators and agents. Always returns 200 OK when the process is running and emits RFC 8288 Link discovery headers.
      operationId: getHealthz
      security: []
      responses:
        '200':
          description: Process is running
          headers:
            Link:
              description: RFC 8288 Web Linking header pointing to agent indexes
              schema:
                type: string
                example: '</llms.txt>; rel="describedby", </llms-full.txt>; rel="alternate"; type="text/markdown"'
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /readyz:
    get:
      summary: Readiness probe
      description: Verifies database and NATS JetStream connectivity. Emits RFC 8288 Link discovery headers.
      operationId: getReadyz
      security: []
      responses:
        '200':
          description: System is ready to accept traffic
          headers:
            Link:
              description: RFC 8288 Web Linking header pointing to agent indexes
              schema:
                type: string
                example: '</llms.txt>; rel="describedby", </llms-full.txt>; rel="alternate"; type="text/markdown"'
          content:
            text/plain:
              schema:
                type: string
                example: ok
        '503':
          description: Underlying services are not ready
          headers:
            Link:
              description: RFC 8288 Web Linking header pointing to agent indexes
              schema:
                type: string
                example: '</llms.txt>; rel="describedby", </llms-full.txt>; rel="alternate"; type="text/markdown"'
          content:
            text/plain:
              schema:
                type: string
                example: pgx not ready

  /docs:
    get:
      summary: Developer documentation portal
      description: "Renders the embedded standalone Scalar developer documentation portal for human operators, or serves full Markdown documentation when requested with Accept: text/markdown."
      operationId: getDocs
      security: []
      parameters:
        - name: Accept
          in: header
          required: false
          description: Media type preference for content negotiation. Pass text/markdown to receive raw Markdown documentation.
          schema:
            type: string
            example: text/markdown
      responses:
        '200':
          description: Scalar API documentation HTML page or full Markdown documentation
          headers:
            Link:
              description: RFC 8288 Web Linking header pointing to agent indexes (/llms.txt, /llms-full.txt)
              schema:
                type: string
                example: '</llms.txt>; rel="describedby", </llms-full.txt>; rel="alternate"; type="text/markdown"'
            Vary:
              description: Informs HTTP caches that representations vary based on Accept and Accept-Encoding headers
              schema:
                type: string
                example: 'Accept, Accept-Encoding'
          content:
            text/html:
              schema:
                type: string
            text/markdown:
              schema:
                type: string

  /docs/openapi.yaml:
    get:
      summary: OpenAPI 3.1 YAML Specification
      description: Returns the raw OpenAPI 3.1 YAML specification directly from embedded binary assets.
      operationId: getOpenAPISpec
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 YAML document
          content:
            application/yaml:
              schema:
                type: string

  /api/openapi.yaml:
    get:
      summary: OpenAPI 3.1 YAML Specification Alias
      description: Alias endpoint delivering the OpenAPI 3.1 YAML specification under the /api prefix.
      operationId: getAPIOpenAPISpecYAML
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 YAML document
          content:
            application/yaml:
              schema:
                type: string

  /openapi.yaml:
    get:
      summary: OpenAPI specification alias
      description: Alias endpoint delivering the OpenAPI 3.1 specification.
      operationId: getOpenAPIAlias
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 YAML document
          content:
            application/yaml:
              schema:
                type: string

  /api/openapi.json:
    get:
      summary: OpenAPI 3.1 JSON Specification
      description: Returns the raw OpenAPI 3.1 JSON specification directly from embedded binary assets.
      operationId: getAPIOpenAPISpecJSON
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 JSON document
          content:
            application/json:
              schema:
                type: object

  /docs/openapi.json:
    get:
      summary: OpenAPI 3.1 JSON Specification
      description: Returns the raw OpenAPI 3.1 JSON specification directly from embedded binary assets.
      operationId: getDocsOpenAPISpecJSON
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 JSON document
          content:
            application/json:
              schema:
                type: object

  /openapi.json:
    get:
      summary: OpenAPI specification alias (JSON)
      description: Alias endpoint delivering the OpenAPI 3.1 JSON specification.
      operationId: getOpenAPIAliasJSON
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 JSON document
          content:
            application/json:
              schema:
                type: object

  /docs/scalar.js:
    get:
      summary: Standalone Scalar JavaScript asset
      description: Delivers the offline compiled Scalar JavaScript bundle.
      operationId: getScalarJS
      security: []
      responses:
        '200':
          description: JavaScript bundle
          content:
            application/javascript:
              schema:
                type: string

  /llms.txt:
    get:
      summary: Curated LLM and agent index
      description: Returns the curated agent index in Markdown format adhering to the llmstxt.org specification, linking to full documentation and API contracts.
      operationId: getLLMsTxt
      security: []
      responses:
        '200':
          description: Curated agent documentation index in Markdown
          content:
            text/markdown:
              schema:
                type: string

  /llms-full.txt:
    get:
      summary: Full LLM developer documentation
      description: Returns the comprehensive, concatenated developer documentation in Markdown format for ingestion by autonomous AI agents and LLMs.
      operationId: getLLMsFullTxt
      security: []
      responses:
        '200':
          description: Full developer documentation in Markdown
          content:
            text/markdown:
              schema:
                type: string

  /api/mcp:
    get:
      summary: Model Context Protocol (MCP) Server-Sent Events (SSE) Stream
      description: Establishes a real-time Server-Sent Events (SSE) connection stream for Model Context Protocol (MCP) clients to discover and invoke tools, resources, and prompts.
      operationId: getMCPSSEStream
      security: []
      responses:
        '200':
          description: Active SSE stream established for MCP session
          content:
            text/event-stream:
              schema:
                type: string
        '500':
          description: Internal server error
    post:
      summary: Model Context Protocol (MCP) JSON-RPC Message Dispatch
      description: Dispatches JSON-RPC 2.0 requests to the active MCP session, including tool discovery (tools/list) and tool execution (tools/call) for diagnostics (diagnose_connection_health, simulate_webhook_event, replay_webhook_dlq, inspect_queue_health) and operational workflows.
      operationId: postMCPMessage
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jsonrpc
                - method
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                id:
                  oneOf:
                    - type: string
                    - type: integer
                  example: 1
                method:
                  type: string
                  example: "tools/call"
                params:
                  type: object
      responses:
        '200':
          description: JSON-RPC response or accepted
          content:
            application/json:
              schema:
                type: object

  /api/v1/me:
    get:
      summary: Authenticated workspace profile
      description: Returns the active workspace ID resolved from the Bearer API key or session.
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Workspace identity details
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace_id:
                    type: string
                    format: uuid

  /api/v1/waba/flows/data-exchange:
    post:
      summary: Meta Flow Data Exchange Termination
      description: |
        Terminates Meta Flow asymmetric RSA and AES-128-GCM encryption, validates the stateless HMAC-SHA256 flow_token,
        synchronously delegates decrypted screen transition requests to the workspace's flow_webhook_url, and returns
        encrypted responses to Meta.
      operationId: handleFlowDataExchange
      security: []
      parameters:
        - name: connection_id
          in: query
          required: true
          description: Connection UUID of the WhatsApp Cloud API provider
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowDataExchangeRequest'
      responses:
        '200':
          description: Encrypted base64 response payload returned to Meta
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Invalid request, malformed base64, or decryption failure
        '500':
          description: Cryptographic or internal server error

  /api/v1/connections:
    get:
      summary: List connections
      description: Returns all active messaging connections for the authenticated workspace.
      operationId: listConnections
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of connections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListConnectionsResponse'

  /api/v1/connections/pair:
    post:
      summary: Start WhatsApp Web QR pairing
      description: Initiates a new multi-device pairing session for WhatsApp Web via whatsmeow.
      operationId: startPairing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairConnectionRequest'
      responses:
        '200':
          description: Pairing session initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairConnectionResponse'

  /api/v1/connections/waba:
    post:
      summary: Create WhatsApp Cloud (WABA) connection
      description: Registers a new WhatsApp Cloud API connection, generating or validating an RSA 2048-bit keypair for Meta Flows.
      operationId: createWABAConnection
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWABAConnectionRequest'
      responses:
        '201':
          description: WABA connection created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionItem'

  /api/v1/connections/telegram:
    post:
      summary: Create Telegram connection
      description: Registers a new Telegram Bot connection and registers the inbound webhook callback.
      operationId: createTelegramConnection
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTelegramConnectionRequest'
      responses:
        '201':
          description: Telegram connection created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionItem'

  /api/v1/connections/{id}:
    delete:
      summary: Disconnect and delete connection
      description: Closes active session sockets and removes the connection from the workspace.
      operationId: deleteConnection
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Connection UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Connection deleted

  /api/v1/connections/{id}/qr:
    get:
      summary: Get QR pairing status
      description: Returns the latest QR pairing event or connection status.
      operationId: getQR
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Connection UUID or phone identity
          schema:
            type: string
      responses:
        '200':
          description: QR event status

  /api/v1/connections/{id}/qr/stream:
    get:
      summary: Real-time QR SSE Stream
      description: Streams real-time QR pairing updates via Server-Sent Events (SSE).
      operationId: streamQR
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Connection UUID or phone identity
          schema:
            type: string
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/connections/{id}/flow-public-key:
    get:
      summary: Retrieve Meta Flow RSA public key
      description: Returns the 2048-bit RSA public key formatted in PEM format for Meta Flow Builder registration.
      operationId: getFlowPublicKey
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Connection UUID of the WhatsApp Cloud API provider
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: RSA public key in PEM format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowPublicKeyResponse'

  /api/v1/workspaces/webhook-secret:
    get:
      summary: Get workspace webhook secret
      description: Returns the current HMAC-SHA256 webhook signing secret for the active workspace.
      operationId: getWebhookSecret
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Webhook secret details
    post:
      summary: Generate or rotate webhook secret
      description: Rotates the HMAC-SHA256 signing secret for the workspace.
      operationId: rotateWebhookSecret
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Webhook secret rotated successfully

  /api/v1/workspaces/flow-webhook-url:
    post:
      summary: Set Meta Flow downstream webhook URL
      description: Configures the HTTP endpoint that receives decrypted Meta Flow dynamic screen requests.
      operationId: setFlowWebhookURL
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flow_webhook_url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Flow webhook URL configured successfully

  /api/v1/webhooks/subscriptions:
    get:
      summary: List webhook subscriptions
      description: Returns all configured webhook subscriptions for the workspace.
      operationId: listWebhookSubscriptions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of webhook subscriptions
    post:
      summary: Create webhook subscription
      description: Subscribes a URL to specific messaging and connection events with HMAC signatures.
      operationId: createWebhookSubscription
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
                - events
              properties:
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Subscription created

  /api/v1/campaigns:
    get:
      summary: List broadcast campaigns
      description: Returns all broadcast campaigns in the workspace.
      operationId: listCampaigns
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of campaigns
    post:
      summary: Create broadcast campaign
      description: Schedules or creates a bulk messaging campaign with deep variable interpolation.
      operationId: createCampaign
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - connection_id
              properties:
                name:
                  type: string
                connection_id:
                  type: string
                  format: uuid
                body:
                  type: string
                interactive:
                  $ref: '#/components/schemas/Interactive'
      responses:
        '201':
          description: Campaign created

  /api/v1/waba/templates:
    get:
      summary: List WABA templates
      description: Returns all synced WhatsApp Business Cloud templates in the workspace.
      operationId: listWABATemplates
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of templates
    post:
      summary: Create WABA template
      description: Submits a new template to Meta for review and approval.
      operationId: createWABATemplate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - category
                - language
                - components
              properties:
                name:
                  type: string
                category:
                  type: string
                language:
                  type: string
                components:
                  type: array
                  items:
                    $ref: '#/components/schemas/TemplateComponent'
      responses:
        '201':
          description: Template submitted

  /api/v1/workspaces:
    get:
      summary: List workspaces
      description: Returns workspaces accessible to the authenticated caller.
      operationId: listWorkspaces
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of workspaces
    post:
      summary: Provision workspace
      description: Provisions a new multi-tenant workspace with isolated data and credentials.
      operationId: createWorkspace
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Workspace provisioned

  /api/v1/workspaces/{id}/retention:
    patch:
      summary: Update workspace data retention policy
      description: Configures the LGPD/GDPR media and audit log retention period in days. 0 disables automated retention purging.
      operationId: updateWorkspaceRetention
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Workspace UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - media_retention_days
              properties:
                media_retention_days:
                  type: integer
                  minimum: 0
                  description: Number of days to retain media files and raw message body before irreversible purge.
      responses:
        '200':
          description: Retention policy updated successfully
        '400':
          description: Invalid workspace ID or negative retention days
        '500':
          description: Internal database error

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIKey
      description: Workspace API Key generated from the admin or developer console.

  schemas:
    CreateMessageRequest:
      type: object
      required:
        - to
        - channel
      properties:
        to:
          type: string
          description: Recipient phone number in E.164 format or Telegram chat ID.
          example: "+5511999998888"
        from:
          type: string
          description: Sender identity or connection slug override.
          example: "+5511988887777"
        channel:
          type: string
          enum: [whatsapp, whatsapp_cloud, telegram, instagram, email, email_ses, email_smtp, email_mautic]
          example: "whatsapp_cloud"
        body:
          type: string
          description: Plain text body content (required if media, template, interactive, or product are omitted).
          example: "Olá! Como podemos ajudar hoje?"
        type:
          type: string
          enum: [text, media, template, interactive, product, product_list]
          description: Optional explicit message type identifier.
        media:
          $ref: '#/components/schemas/Media'
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Arbitrary key-value metadata preserved in trace logs and inbound correlation.
        ttl_seconds:
          type: integer
          minimum: 1
          description: Time-to-live in seconds before queue expiry.
          example: 3600
        template_name:
          type: string
          description: Approved Meta WABA template name.
        language:
          type: string
          description: Template language code (e.g. pt_BR, en_US).
          example: "pt_BR"
        components:
          type: array
          items:
            $ref: '#/components/schemas/TemplateComponent'
        fallback_channels:
          type: array
          items:
            type: string
          description: Ordered list of fallback channel identifiers.
          example: ["whatsapp", "telegram"]
        fallback_behavior:
          type: string
          enum: [degrade, fail]
          default: degrade
          description: Degradation policy when target channel lacks native interactive capabilities.
        interactive:
          $ref: '#/components/schemas/Interactive'
        product:
          $ref: '#/components/schemas/ProductPayload'
        channel_overrides:
          type: object
          additionalProperties: true
          description: Channel-specific native parameters passed directly to downstream adapters.

    CreateMessageResponse:
      type: object
      required:
        - message_id
        - status
        - queued_at
      properties:
        message_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, sent, delivered, read, failed]
          example: "queued"
        queued_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "invalid_payload"
        message:
          type: string
          example: "request body validation failed"
        more_info:
          type: string
          format: uri
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: "to"
        message:
          type: string
          example: "is required and must be in E.164 format"

    Media:
      type: object
      required:
        - media_url
        - media_type
      properties:
        media_url:
          type: string
          format: uri
          example: "https://example.com/files/invoice.pdf"
        media_type:
          type: string
          enum: [image, document, audio, video]
          example: "document"
        filename:
          type: string
          example: "invoice.pdf"
        caption:
          type: string
          example: "Sua fatura do mês de agosto."
        duration_ms:
          type: integer
          description: Total audio duration in milliseconds.
          example: 1850
        rms_energy:
          type: number
          format: double
          description: Normalized Root Mean Square acoustic energy in [0.0, 1.0].
          example: 0.0854
        telemetry:
          $ref: '#/components/schemas/AudioTelemetry'

    AudioTelemetry:
      type: object
      properties:
        duration_ms:
          type: integer
          description: Total duration in milliseconds.
          example: 1850
        voiced_duration_ms:
          type: integer
          description: Active voiced audio duration in milliseconds.
          example: 1600
        rms_energy:
          type: number
          format: double
          description: Normalized Root Mean Square acoustic energy in [0.0, 1.0].
          example: 0.0854
        sample_rate:
          type: integer
          description: Audio sample rate in Hz.
          example: 48000
        channels:
          type: integer
          description: Channel count (1 for mono, 2 for stereo).
          example: 1
        format:
          type: string
          description: Detected audio format.
          example: "ogg/opus"

    EventTiming:
      type: object
      description: Response timing telemetry tracking contact engagement latency between outbound and inbound events.
      properties:
        response_latency_ms:
          type: integer
          description: Elapsed time in milliseconds between the last outbound message sent and this inbound message arrival.
          example: 2450
        last_outbound_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of the last outbound message sent to the contact.
          example: "2026-08-28T20:15:12Z"

    InboundEventPayload:
      type: object
      required:
        - event
        - trace_id
        - message_id
        - channel
        - timestamp
        - workspace_id
        - from
      properties:
        event:
          type: string
          example: "inbound_message"
        trace_id:
          type: string
          example: "018d4512-321b-789a-bcde-f0123456789a"
        message_id:
          type: string
          example: "wamid.HBgLNTUxMTk5..."
        channel:
          type: string
          enum: [whatsapp, whatsapp_cloud, telegram, instagram, email]
          example: "whatsapp_cloud"
        timestamp:
          type: string
          format: date-time
          example: "2026-08-28T20:15:15Z"
        workspace_id:
          type: string
          format: uuid
        from:
          type: string
          description: Contact phone number or chat ID (or SHA-256 hash if workspace PII is opted out).
          example: "+5511999998888"
        to:
          type: string
          description: PerGo receiving identity / sender identity.
          example: "+5511888887777"
        body:
          type: string
          example: "Sim, consumo produtos orgânicos."
        media:
          $ref: '#/components/schemas/Media'
        timing:
          $ref: '#/components/schemas/EventTiming'
        sender_name:
          type: string
          example: "Ana Clara"
        metadata:
          type: object
          additionalProperties:
            type: string

    TemplateComponent:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [header, body, button]
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/TemplateParameter'

    TemplateParameter:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [text, currency, date_time, image, document, video]
        text:
          type: string
          example: "Carlos"

    Interactive:
      type: object
      required:
        - type
        - body
        - action
      properties:
        type:
          type: string
          enum: [button, list, flow]
          description: Interactive message component type.
        header:
          $ref: '#/components/schemas/TextContent'
        body:
          $ref: '#/components/schemas/TextContent'
        footer:
          $ref: '#/components/schemas/TextContent'
        action:
          $ref: '#/components/schemas/Action'

    TextContent:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          example: "Escolha uma das opções abaixo:"

    Action:
      type: object
      properties:
        button:
          type: string
          description: Label text for the main list menu button.
          example: "Ver Serviços"
        buttons:
          type: array
          items:
            $ref: '#/components/schemas/Button'
          description: Up to 3 quick reply buttons.
        sections:
          type: array
          items:
            $ref: '#/components/schemas/Section'
          description: Up to 10 list sections containing selectable rows.
        flow_token:
          type: string
          description: Optional custom flow token; auto-generated with HMAC-SHA256 if omitted.
        flow_id:
          type: string
          description: Meta Flow ID configured in WhatsApp Business Manager.
          example: "123456789012345"
        flow_cta:
          type: string
          description: CTA button label displayed on the WhatsApp Flow bubble.
          example: "Abrir Cadastro"
        flow_action:
          type: string
          enum: [navigate, data_exchange]
          default: navigate
        flow_action_payload:
          type: object
          additionalProperties: true
          description: Initial screen parameters and pre-populated form fields.

    Button:
      type: object
      required:
        - type
        - reply
      properties:
        type:
          type: string
          enum: [reply]
          default: reply
        reply:
          $ref: '#/components/schemas/Reply'

    Reply:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
          example: "btn_suporte"
        title:
          type: string
          example: "Suporte Técnico"

    Section:
      type: object
      required:
        - rows
      properties:
        title:
          type: string
          example: "Planos Disponíveis"
        rows:
          type: array
          items:
            $ref: '#/components/schemas/Row'

    Row:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
          example: "row_pro"
        title:
          type: string
          example: "Plano Pro"
        description:
          type: string
          example: "Acesso total a todas as integrações"

    ProductPayload:
      type: object
      properties:
        catalog_id:
          type: string
          example: "cat_987654321"
        product_retailer_id:
          type: string
          example: "sku_prod_001"
        header:
          type: string
        body:
          type: string
        footer:
          type: string
        sections:
          type: array
          items:
            $ref: '#/components/schemas/ProductSection'

    ProductSection:
      type: object
      properties:
        title:
          type: string
          example: "Lançamentos"
        product_items:
          type: array
          items:
            $ref: '#/components/schemas/ProductItem'

    ProductItem:
      type: object
      required:
        - product_retailer_id
      properties:
        product_retailer_id:
          type: string
          example: "prod_camisa_azul"
        item_price:
          type: number
          example: 89.90
        currency:
          type: string
          example: "BRL"
        quantity:
          type: integer
          example: 1

    FlowDataExchangeRequest:
      type: object
      required:
        - encrypted_flow_data
        - encrypted_aes_key
        - initial_vector
      properties:
        encrypted_flow_data:
          type: string
          description: Base64-encoded ciphertext and 16-byte GCM authentication tag.
        encrypted_aes_key:
          type: string
          description: Base64-encoded 128-bit AES session key encrypted with connection RSA public key.
        initial_vector:
          type: string
          description: Base64-encoded 12-byte initialization vector.

    FlowPublicKeyResponse:
      type: object
      required:
        - public_key_pem
      properties:
        public_key_pem:
          type: string
          description: 2048-bit RSA public key formatted in standard PEM encoding.

    ConnectionItem:
      type: object
      required:
        - id
        - name
        - slug
        - channel
        - sender_identity
        - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        channel:
          type: string
        sender_identity:
          type: string
        status:
          type: string
        is_default:
          type: boolean
        connected_since:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ListConnectionsResponse:
      type: object
      required:
        - connections
      properties:
        connections:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionItem'

    PairConnectionRequest:
      type: object
      required:
        - channel
      properties:
        channel:
          type: string
          enum: [whatsapp]
        phone:
          type: string
        name:
          type: string
        proxy_url:
          type: string

    PairConnectionResponse:
      type: object
      required:
        - connection_id
        - status
        - message
      properties:
        connection_id:
          type: string
          format: uuid
        phone:
          type: string
        status:
          type: string
        message:
          type: string

    CreateWABAConnectionRequest:
      type: object
      required:
        - phone_number_id
        - waba_account_id
        - token
      properties:
        name:
          type: string
        phone_number_id:
          type: string
        waba_account_id:
          type: string
        token:
          type: string
        verify_token:
          type: string
        app_secret:
          type: string
        display_phone_number:
          type: string
        verified_name:
          type: string
        private_key:
          type: string
          description: Optional RSA private key PEM override. If omitted, PerGo auto-generates a 2048-bit keypair.

    CreateTelegramConnectionRequest:
      type: object
      required:
        - token
      properties:
        name:
          type: string
        token:
          type: string
        secret_token:
          type: string

    MCPDiagnoseConnectionHealthRequest:
      type: object
      required:
        - workspace_id
        - connection_id
      properties:
        workspace_id:
          type: string
          format: uuid
          description: The UUID of the workspace.
        connection_id:
          type: string
          format: uuid
          description: The UUID of the connection to diagnose.

    MCPConnectionHealthDiagnosticResponse:
      type: object
      required:
        - connection_id
        - workspace_id
        - name
        - channel
        - status
        - socket_status
        - credentials_valid
        - self_healing_guidance
      properties:
        connection_id:
          type: string
          format: uuid
          description: The UUID of the connection.
        workspace_id:
          type: string
          format: uuid
          description: The UUID of the workspace.
        name:
          type: string
          description: Human-readable name of the connection.
        channel:
          type: string
          description: Channel type (whatsapp, whatsapp_cloud, telegram).
        status:
          type: string
          description: Overall connection status (connected, disconnected, pairing, error).
        socket_status:
          type: string
          description: Socket liveness status (connected, disconnected, not_applicable).
        proxy_health:
          $ref: '#/components/schemas/MCPProxyHealth'
        credentials_valid:
          type: boolean
          description: Whether the credentials are valid and authenticated.
        latency_ms:
          type: integer
          format: int64
          description: Round-trip diagnostic latency in milliseconds.
        pairing_status:
          type: string
          description: Active pairing state for WhatsApp Web.
        last_error:
          type: string
          description: Last recorded error message if connection is unhealthy.
        self_healing_guidance:
          type: string
          description: Actionable guidance for agents to self-heal the connection.

    MCPProxyHealth:
      type: object
      required:
        - configured
        - reachable
        - latency_ms
      properties:
        configured:
          type: boolean
          description: Whether a proxy URL is configured on the connection.
        reachable:
          type: boolean
          description: Whether the proxy endpoint responded to TCP probe.
        latency_ms:
          type: integer
          format: int64
          description: TCP dial probe latency in milliseconds.
        error:
          type: string
          description: Probe error message if unreachable.

    MCPSimulateWebhookEventRequest:
      type: object
      required:
        - workspace_id
        - event_type
        - payload
      properties:
        workspace_id:
          type: string
          format: uuid
          description: The UUID of the workspace.
        event_type:
          type: string
          description: The webhook event type (e.g. message.received, flow.submitted).
          example: "message.received"
        payload:
          description: Synthetic event payload to dispatch (JSON object or string).
          oneOf:
            - type: object
            - type: string
        subscription_id:
          type: string
          format: uuid
          description: Optional UUID of an existing webhook subscription to target.
        target_url:
          type: string
          format: uri
          description: Optional destination URL to dispatch to (overrides subscription URL).

    MCPWebhookSimulationTelemetry:
      type: object
      required:
        - target_url
        - event_type
        - trace_id
        - status_code
        - latency_ms
        - success
      properties:
        subscription_id:
          type: string
          format: uuid
          description: Targeted subscription UUID if resolved.
        target_url:
          type: string
          format: uri
          description: Actual destination URL dispatched to.
        event_type:
          type: string
          description: Dispatched event type.
        trace_id:
          type: string
          description: Trace ID header injected into the dispatch.
        status_code:
          type: integer
          description: HTTP response status code received from subscriber.
        latency_ms:
          type: integer
          format: int64
          description: Dispatch round-trip latency in milliseconds.
        success:
          type: boolean
          description: Whether the dispatch succeeded (2xx HTTP response).
        response_body:
          type: string
          description: Response body returned by the subscriber endpoint.
        error:
          type: string
          description: Network or policy error message (e.g. anti-SSRF rejection).

    MCPReplayWebhookDLQRequest:
      type: object
      required:
        - workspace_id
      properties:
        workspace_id:
          type: string
          format: uuid
          description: The UUID of the workspace.
        dlq_id:
          type: string
          format: uuid
          description: Optional UUID of a specific dead-letter item to replay.
        subscription_id:
          type: string
          format: uuid
          description: Optional UUID of a webhook subscription to filter dead-letter items.
        action:
          type: string
          enum:
            - re-enqueue
            - dispatch_immediate
          default: re-enqueue
          description: Action to perform (publish back to NATS or direct delivery).
        limit:
          type: integer
          default: 10
          maximum: 50
          description: Maximum dead-letter items to replay when dlq_id is not specified.
        target_url:
          type: string
          format: uri
          description: Optional override destination URL when action is dispatch_immediate.

    MCPWebhookDLQReplayResult:
      type: object
      required:
        - workspace_id
        - action
        - total_processed
        - success_count
        - failure_count
        - replayed_items
      properties:
        workspace_id:
          type: string
          format: uuid
          description: The UUID of the workspace.
        action:
          type: string
          description: Replay action executed (re-enqueue or dispatch_immediate).
        total_processed:
          type: integer
          description: Total number of dead-letter items processed.
        success_count:
          type: integer
          description: Number of successfully replayed items.
        failure_count:
          type: integer
          description: Number of failed replay attempts.
        replayed_items:
          type: array
          items:
            $ref: '#/components/schemas/MCPWebhookDLQReplayItem'

    MCPWebhookDLQReplayItem:
      type: object
      required:
        - dlq_id
        - subscription_id
        - event_type
        - trace_id
        - success
      properties:
        dlq_id:
          type: string
          format: uuid
          description: Dead-letter queue item UUID.
        subscription_id:
          type: string
          format: uuid
          description: Subscription UUID.
        event_type:
          type: string
          description: Webhook event type.
        trace_id:
          type: string
          description: Message trace ID.
        message_id:
          type: string
          description: Originating message ID.
        target_url:
          type: string
          description: Destination URL dispatched to.
        subject:
          type: string
          description: NATS JetStream subject published to.
        status_code:
          type: integer
          description: HTTP status code received.
        latency_ms:
          type: integer
          format: int64
          description: Round-trip dispatch latency in milliseconds.
        success:
          type: boolean
          description: Whether the delivery or re-enqueue succeeded.
        response_body:
          type: string
          description: Response body payload from the destination webhook receiver (truncated to 4KB).
        deleted_from_dlq:
          type: boolean
          description: Whether item was purged from PostgreSQL DLQ.
        error:
          type: string
          description: Error message if replay attempt failed.

    MCPInspectQueueHealthRequest:
      type: object
      properties:
        workspace_id:
          type: string
          format: uuid
          description: Optional workspace UUID to filter or context-tag queue inspection.

    MCPQueueHealthReport:
      type: object
      required:
        - status
        - timestamp
        - total_messages
        - total_bytes
        - streams
      properties:
        status:
          type: string
          enum:
            - healthy
            - degraded
            - backpressure
            - offline
          description: Overall queue health status across monitored streams.
        timestamp:
          type: string
          format: date-time
          description: Timestamp when queue health was inspected.
        workspace_id:
          type: string
          description: Context-tagged workspace UUID.
        total_messages:
          type: integer
          description: Aggregate message count across monitored streams.
        total_bytes:
          type: integer
          description: Aggregate storage bytes across monitored streams.
        streams:
          type: array
          items:
            $ref: '#/components/schemas/MCPStreamHealthReport'
        details:
          type: string
          description: Additional diagnostics context or degraded root cause.

    MCPStreamHealthReport:
      type: object
      required:
        - name
        - status
        - msgs
        - bytes
        - consumers
        - first_seq
        - last_seq
        - consumer_stats
      properties:
        name:
          type: string
          description: JetStream stream name (MESSAGES, WEBHOOKS, WEBHOOK_DELIVERIES, INBOUND).
        status:
          type: string
          enum:
            - healthy
            - degraded
            - backpressure
            - not_found
            - error
            - offline
          description: Health status of this individual stream.
        msgs:
          type: integer
          description: Total messages stored in the stream.
        bytes:
          type: integer
          description: Total storage bytes consumed by the stream.
        consumers:
          type: integer
          description: Number of active pull/push consumers on the stream.
        first_seq:
          type: integer
          description: Sequence number of the first message in the stream.
        last_seq:
          type: integer
          description: Sequence number of the latest message in the stream.
        consumer_stats:
          type: array
          items:
            $ref: '#/components/schemas/MCPConsumerHealthReport'
        error:
          type: string
          description: Error message if stream inspection failed.

    MCPConsumerHealthReport:
      type: object
      required:
        - name
        - stream
        - num_pending
        - num_ack_pending
        - num_waiting
      properties:
        name:
          type: string
          description: Durable consumer name.
        stream:
          type: string
          description: Stream name.
        num_pending:
          type: integer
          description: Number of messages pending delivery (consumer lag).
        num_ack_pending:
          type: integer
          description: Number of unacknowledged in-flight messages.
        num_waiting:
          type: integer
          description: Number of pull requests waiting for messages.
