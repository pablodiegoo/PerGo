name: "Bug Report"
description: "File a bug report to help us improve PerGo"
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please ensure you search [existing issues](https://github.com/pablodiegoo/PerGo/issues) before submitting.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: dropdown
    id: affected_channel
    attributes:
      label: Affected Channel / Component
      description: Select which messaging channel or core component is affected.
      options:
        - "WhatsApp Web (whatsmeow)"
        - "WhatsApp Cloud (WABA)"
        - "Telegram"
        - "Webhooks / Inbound Router"
        - "Admin UI / Templates"
        - "Core Platform / Other"
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Start PerGo with 'make dev'
        2. Send an inbound message via ...
        3. Observe error ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System (OS)
      description: e.g. Ubuntu 22.04 LTS, macOS Sonoma 14.5, Windows 11 WSL2
      placeholder: e.g. Ubuntu 22.04
    validations:
      required: true

  - type: input
    id: go_version
    attributes:
      label: Go Version
      description: Run `go version` and paste the output.
      placeholder: e.g. go version go1.26.4 linux/amd64
    validations:
      required: true

  - type: input
    id: pergo_version
    attributes:
      label: PerGo Version / Commit SHA
      description: The git commit hash or release tag you are running.
      placeholder: e.g. commit d873c59 or v1.0.0
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Stack Traces
      description: |
        Please paste any relevant server logs or terminal output.
        IMPORTANT: Redact all PII (Personally Identifiable Information), phone numbers, tokens, API keys, and sensitive data before submitting!
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-flight Confirmation
      options:
        - label: "I have searched existing issues to ensure this is not a duplicate."
          required: true
        - label: "I have redacted all PII, phone numbers, and secrets from logs and snippets."
          required: true
